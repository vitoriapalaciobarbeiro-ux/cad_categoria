<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Serviço Extra</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/servico_extra.css') }}">
</head>

<body>
  <div class="header">

      <img class="logo_branca" src="../static/img/logo_branca.png" alt="Logo">

      <div class="inicio_relatorio_previsao">
          <a href="index.html">Início</a>
          <a href="#">Relatórios</a>
          <a href="#">Previsões</a>
      </div>

      <div class="usuario">
          <a class="icone_user">
            <img src="{{ url_for('static', filename=img) }}" alt="Foto de usuário">
            </a>
          <p>Olá, {{ nome }}</p>
          <a href="{{ url_for('logout') }}" class="logout">
              <img src="../static/img/logout.png" alt="Sair">
          </a>
      </div>

  </div>
  <main>

      <div class="esquerda">
          <img src="../static/img/logo.png" alt="Meu Salário">
      </div>

      <div class="direita">
          <a href="{{ url_for('historico_servico_extra') }}" class="voltar">⟵ Voltar</a>
          <div class="formulario">
              <div class="titulo">
                  <span class="mais">+</span>
                  <h2>Serviços extras</h2>
              </div>

              <p class="descricao-titulo">
                  Adicione os dados sobre os serviços excepcionais.
              </p>

              <form action="{{ url_for('cadastrar_servico') }}" method="post">

                  <div class="linha">
                      <div class="campo">
                          <label for="servico">Serviço realizado</label>
                          <input type="text" name="servico" id="servico"
                                 placeholder="Insira o serviço realizado" required>
                      </div>

                      <div class="campo">
                          <label for="valor">Valor</label>
                          <input type="number" name="valor" id="valor"
                                 placeholder="R$ 0,00" min="0.01"
                                 step="0.01" required>
                      </div>

                  </div>

                  <div class="linha">
                      <div class="campo">
                          <label for="data">Data</label>
                          <input type="date" name="data" id="data" required value="{{data}}" disabled>
                      </div>
                      <div class="campo botao">
                          <button type="submit">Salvar</button>
                      </div>
                  </div>
              </form>

          </div>
      </div>

  </main>
</body>
</html>
